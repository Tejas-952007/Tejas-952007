<svg fill="none" viewBox="0 0 1200 320" width="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050711" />
      <stop offset="50%" stop-color="#0b1026" />
      <stop offset="100%" stop-color="#04060d" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyan-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    
    <linearGradient id="purple-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#ff0080" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    
    <linearGradient id="glow-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="30%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#7928ca" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="radial-glow1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="radial-glow2" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <!-- Card Glass Gradient -->
    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01" />
    </linearGradient>
  </defs>

  <style>
    .title-text {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 52px;
      font-weight: 900;
      letter-spacing: 2px;
    }
    .sub-text {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 4px;
      fill: #38bdf8;
    }
    .tagline-text {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 1.5px;
      fill: #94a3b8;
    }
    .code-tag {
      font-family: 'Fira Code', monospace;
      font-size: 12px;
      fill: #64748b;
    }
    .pulse-node {
      animation: pulse 3s infinite alternate;
    }
    @keyframes pulse {
      0% { r: 4px; opacity: 0.6; }
      100% { r: 7px; opacity: 1; }
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)" />

  <!-- Radial Glow Background Highlights -->
  <rect width="1200" height="320" rx="16" fill="url(#radial-glow1)" />
  <rect width="1200" height="320" rx="16" fill="url(#radial-glow2)" />

  <!-- Technical Grid Overlay -->
  <rect width="1200" height="320" rx="16" fill="url(#grid-pattern)" />

  <!-- Decorative Outer Glow Border -->
  <rect x="1.5" y="1.5" width="1197" height="317" rx="14.5" fill="none" stroke="url(#cyan-blue)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Abstract Neural Network / Node Graphics (Right Side) -->
  <g opacity="0.85">
    <!-- Connecting Lines -->
    <path d="M 820 80 L 930 140 L 1060 90 L 1120 180 M 930 140 L 980 230 L 1110 240 M 820 80 L 880 210 L 980 230" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="4,4" />
    <path d="M 880 210 L 1060 90 M 930 140 L 1110 240" stroke="#7928ca" stroke-width="1.5" stroke-opacity="0.4" />
    
    <!-- Neural Nodes -->
    <circle cx="820" cy="80" r="5" fill="#00f2fe" />
    <circle cx="820" cy="80" r="10" fill="#00f2fe" fill-opacity="0.2" />

    <circle cx="930" cy="140" r="6" fill="#38bdf8" />
    <circle cx="930" cy="140" r="13" fill="#38bdf8" fill-opacity="0.15" />

    <circle cx="1060" cy="90" r="7" fill="#7928ca" />
    <circle cx="1060" cy="90" r="15" fill="#7928ca" fill-opacity="0.2" />

    <circle cx="1120" cy="180" r="5" fill="#ff0080" />
    <circle cx="1120" cy="180" r="11" fill="#ff0080" fill-opacity="0.2" />

    <circle cx="880" cy="210" r="6" fill="#00f2fe" />
    <circle cx="980" cy="230" r="8" fill="#38bdf8" />
    <circle cx="980" cy="230" r="16" fill="#38bdf8" fill-opacity="0.2" />
    
    <circle cx="1110" cy="240" r="5" fill="#7928ca" />
  </g>

  <!-- Futuristic Data Streams / Waveform (Bottom Decorative) -->
  <path d="M 0 280 Q 300 240 600 280 T 1200 270" fill="none" stroke="url(#cyan-blue)" stroke-width="1.5" stroke-opacity="0.3" />
  <path d="M 0 290 Q 350 310 700 285 T 1200 295" fill="none" stroke="url(#purple-pink)" stroke-width="1" stroke-opacity="0.25" />

  <!-- Main Glassmorphism Card (Left/Center Content Container) -->
  <rect x="50" y="45" width="720" height="230" rx="14" fill="url(#glass-grad)" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1" />
  
  <!-- Corner Accent Lines -->
  <path d="M 50 65 L 50 45 L 70 45" stroke="#00f2fe" stroke-width="2.5" fill="none" />
  <path d="M 770 65 L 770 45 L 750 45" stroke="#00f2fe" stroke-width="2.5" fill="none" />
  <path d="M 50 255 L 50 275 L 70 275" stroke="#7928ca" stroke-width="2.5" fill="none" />
  <path d="M 770 255 L 770 275 L 750 275" stroke="#7928ca" stroke-width="2.5" fill="none" />

  <!-- Code Header Tag -->
  <text x="80" y="80" class="code-tag">&lt;system_identity id="tejas_ingle" status="building"&gt;</text>
  
  <!-- Main Name Title -->
  <text x="80" y="140" class="title-text" fill="url(#text-grad)">TEJAS INGLE</text>

  <!-- Role Subtitle -->
  <text x="82" y="178" class="sub-text">AI &amp; DATA SCIENCE ENGINEER</text>

  <!-- Divider Bar -->
  <rect x="80" y="196" width="660" height="2" fill="url(#glow-line)" />

  <!-- Domain & Specialization Tagline -->
  <text x="80" y="228" class="tagline-text">NEURAL ARCHITECTURES  •  AGENTIC AI  •  FULL-STACK INNOVATION</text>

  <!-- Terminal Status Line -->
  <g transform="translate(80, 246)">
    <circle cx="6" cy="6" r="4" fill="#10b981" />
    <circle cx="6" cy="6" r="7" fill="#10b981" fill-opacity="0.3" />
    <text x="22" y="10" font-family="'Fira Code', monospace" font-size="11" fill="#a7f3d0">LOC: SPPU PUNE  |  FOCUS: LLMs • RAG • MULTIMODAL SYSTEMS</text>
  </g>
</svg>
